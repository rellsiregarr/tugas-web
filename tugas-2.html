<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <h1>Tugas 2</h1>
        <table>
           <tr>
            <td><label for="text">Username</label></td>
            <td>:</td>
            <td><input type="text" id="text"></td>
           </tr>
            <td><label for="password">Password</label></td>
            <td>:</td>
            <td><input type="password" id="password"></td>
           <tr>
            <td>    
                <label for="gender">Jenis Kelamin</label>
            </td>
            <td>:</td>
            <td>
                <input type="radio" name="gender" id="female">
                <label for="female">Perempuan</label>
                <input type="radio" name="gender" id="male">
                <label for="male">Laki-laki</label>
            </td>
           </tr>
           <tr>
            <td>
                <label for="hobby">Hobby</label>
            </td>
            <td>:</td>
            <td>
                <input type="checkbox" name="hobby" id="membaca">
                <label for="membaca">Membaca</label>
                <input type="checkbox" name="hobby" id="menulis">
                <label for="menulis">Menulis</label>
                <input type="checkbox" name="hobby" id="olahraga">
                <label for="olahraga">Olahraga</label>
            </td>
           </tr>
           <tr>
            <td>
                <input type="submit" value="Submit">
            </td>
           </tr>
           <tr>
            <td>
                <label for="select_options">select options</label>
            </td>
            <td>:</td>
            <td>
                <select name="select_options" >
                    <option value="option1">Option 1</option>
                    <option value="option2">Option 2</option>
                    <option value="option3">Option 3</option>
                </select>
            </td>

           </tr>
        </table>
    </form>
</body>
</html>
